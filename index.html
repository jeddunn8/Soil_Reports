<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TCCA Soil Report</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.28/"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Helvetica,Arial,sans-serif;background:#f5f5f5;color:#333}

.h{background:#0F1F5E;color:#fff;padding:14px 20px}
.h h1{font-size:20px}

.c{background:#fff;padding:16px 20px;border-bottom:2px solid #0F1F5E;display:flex;gap:10px;align-items:center}

.c input{padding:8px 12px;font-size:14px;border:2px solid #ccc;border-radius:4px;width:180px}

.b{background:#0F1F5E;color:#fff;border:none;padding:8px 20px;font-size:14px;border-radius:4px;cursor:pointer;font-weight:bold}
.b:hover{background:#2a5580}

#s{padding:10px 20px;font-size:13px;color:#666;display:none}
#r{padding:20px;display:none}

.rc{background:#fff;max-width:1100px;margin:0 auto;border:1px solid #ddd;border-radius:4px;overflow:hidden}

.rh{background:#0F1F5E;color:#fff;padding:14px 20px}
.rh h2{font-size:20px;margin:0}

.rb{padding:16px 20px}

.ig{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 20px;margin-bottom:16px;font-size:13px}
.ig b{color:#0F1F5E}

.rb h3{color:#0F1F5E;font-size:14px;margin:16px 0 8px}

table{width:100%;border-collapse:collapse;font-size:11px}

thead th{
background:#0F1F5E;
color:#fff;
padding:6px 4px;
text-align:center;
border:1px solid #0F1F5E
}

thead th:first-child{text-align:left}

tbody td{
padding:4px;
text-align:center;
border:1px solid #CCC
}

tbody td:first-child{text-align:left}

/* keeps date clean */
td:nth-child(3){
white-space:nowrap;
text-align:center;
}

tbody tr:nth-child(even){background:#F0F0F0}

.t{background:#E8E8E8!important;font-weight:bold}

.f{
margin-top:20px;
text-align:center;
font-size:10px;
color:#999;
border-top:1px solid #CCC;
padding-top:6px
}

.np{text-align:center;margin:8px}

.bp{
background:#2ecc71;
color:#fff;
border:none;
padding:8px 20px;
font-size:14px;
border-radius:4px;
cursor:pointer
}

@media print{
.h,.c,#s,.np{display:none!important}
#r{padding:0}
.rc{border:none}
@page{size:landscape;margin:.5in}
}
</style>
</head>

<body>

<div class="h">
<h1>TCCA Soil Report Generator</h1>
</div>

<div class="c">
<b style="color:#0F1F5E">Farm Number:</b>
<input id="fn" value="1071">
<button class="b" id="go">Generate Report</button>
</div>

<div id="s"></div>
<div id="r"></div>

<script>

var PORTAL="https://tillamookfarm.maps.arcgis.com";
var SERVER="https://services3.arcgis.com/6rtKUOn0HwWMTo5b/arcgis";
var QUERY_URL=SERVER+"/rest/services/Dashboard_Internal_WFL1/FeatureServer/8/query";
var APP_ID="PZTMDvs9PDdeYrAu";

var serverToken="";
var authReady=false;

function showStatus(m){
  var e=document.getElementById("s");
  e.style.display="block";
  e.textContent=m;
}

function hideStatus(){
  document.getElementById("s").style.display="none";
}

function fm(v,d){
  if(v==null||v==="")return"";
  return parseFloat(v).toFixed(d!=null?d:1);
}

/* ✅ DATE FORMATTER */
function fdate(v){
  if(!v) return "";
  var d=new Date(v);
  return (d.getMonth()+1)+"/"+d.getDate()+"/"+d.getFullYear();
}

showStatus("Signing in to ArcGIS Online...");

require(["esri/config","esri/identity/OAuthInfo","esri/identity/IdentityManager"],
function(cfg,OAuthInfo,idm){

cfg.portalUrl=PORTAL;

var info=new OAuthInfo({
appId:APP_ID,
portalUrl:PORTAL,
popup:false
});

idm.registerOAuthInfos([info]);

idm.checkSignInStatus(PORTAL+"/sharing").catch(function(){
return idm.getCredential(PORTAL+"/sharing");
}).then(function(cred){

fetch(PORTAL+"/sharing/rest/generateToken",{
method:"POST",
body:new URLSearchParams({
token:cred.token,
serverUrl:SERVER,
f:"json"
})
})
.then(r=>r.json())
.then(d=>{
if(d.token){
serverToken=d.token;
authReady=true;
hideStatus();
}else{
showStatus("Token exchange failed.");
}
});

});
});

document.getElementById("go").onclick=function(){

var fn=document.getElementById("fn").value.trim();
if(!fn){showStatus("Enter Farm Number");return;}

fetch(
QUERY_URL+
"?where="+encodeURIComponent("PrimProdNum='"+fn+"'")+
"&outFields=PrimProdNum,PastureNumber,Producer,CAFO_Size,Acreage,SoilLastTest2,Nitrate,Ammonia,Phosphate,Potassium,OrgCarbon,PHLevel"+
"&returnGeometry=false&f=json&token="+serverToken
)
.then(r=>r.json())
.then(function(d){

if(!d.features){showStatus("No data");return;}

var fs=d.features;
var pr=fs[0].attributes.Producer || "";
var ca=fs[0].attributes.CAFO_Size || "";

var ta=0;
var ru=0;
var ro="";

for(var i=0;i<fs.length;i++){

var a=fs[i].attributes;
var ac=parseFloat(a.Acreage||0);

ru+=ac;
ta+=ac;

ro+=`
<tr>
<td>${a.PastureNumber||""}</td>
<td style="text-align:right">${fm(ac,2)}</td>
<td>${fdate(a.SoilLastTest2)}</td>
<td>${fm(a.Nitrate)}</td>
<td>${fm(a.Ammonia)}</td>
<td>${fm(a.Phosphate)}</td>
<td>${fm(a.Potassium,0)}</td>
<td>${fm(a.OrgCarbon)}</td>
<td>${fm(a.PHLevel)}</td>
</tr>`;
}

/* ✅ FIXED TOTAL ROW */
ro+=`
<tr class="t">
<td>TOTAL</td>
<td style="text-align:right">${ru.toFixed(2)}</td>
<td></td>
<td></td>
<td></td>
<td></td>
<td></td>
<td></td>
<td></td>
</tr>`;

document.getElementById("r").innerHTML=
`
<div class="rc">
<div class="rh">
<h2>TCCA Soil Sampling Report</h2>
</div>

<div class="rb">

<div class="ig">
<div><b>Farm:</b> ${fn}</div>
<div><b>Producer:</b> ${pr}</div>
<div><b>CAFO:</b> ${ca}</div>
<div><b>Pastures:</b> ${fs.length}</div>
<div><b>Acres:</b> ${ta.toFixed(2)}</div>
<div><b>Date:</b> ${new Date().toLocaleDateString()}</div>
</div>

<h3>Soil Sample Results</h3>

<table>
<thead>
<tr>
<th>Pasture</th>
<th>Acres</th>
<th>Last Sample Date</th>
<th>Nitrate<br>(ppm)</th>
<th>Ammonia<br>(ppm)</th>
<th>Phosphate<br>(ppm)</th>
<th>Potassium<br>(ppm)</th>
<th>Org Matter<br>(%)</th>
<th>pH</th>
</tr>
</thead>

<tbody>
${ro}
</tbody>
</table>

/* ✅ UPDATED FOOTER */
<div class="f">
Tillamook County Creamery Association, Field Services
</div>

</div>
</div>

<div class="np">
<button class="bp" onclick="window.print()">
Print / Save as PDF
</button>
</div>
`;

document.getElementById("r").style.display="block";
hideStatus();

});
};

</script>
</body>
</html>
