<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TCCA Soil Report</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.28/"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Helvetica,Arial,sans-serif;background:#f5f5f5;color:#333}
.h{background:#0F1F5E;color:#fff;padding:14px 20px}
.h h1{font-size:20px}
.c{background:#fff;padding:16px 20px;border-bottom:2px solid #0F1F5E;display:flex;gap:10px;align-items:center}
.c input{padding:8px 12px;font-size:14px;border:2px solid #ccc;border-radius:4px;width:180px}
.b{background:#0F1F5E;color:#fff;border:none;padding:8px 20px;font-size:14px;border-radius:4px;cursor:pointer;font-weight:bold}
.b:hover{background:#2a5580}
#s{padding:10px 20px;font-size:13px;color:#666;display:none}
#r{padding:20px;display:none}
.rc{background:#fff;max-width:1100px;margin:0 auto;border:1px solid #ddd;border-radius:4px;overflow:hidden}
.rh{background:#0F1F5E;color:#fff;padding:14px 20px}
.rh h2{font-size:20px;margin:0}
.rb{padding:16px 20px}
.ig{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 20px;margin-bottom:16px;font-size:13px}
.ig b{color:#0F1F5E}
.rb h3{color:#0F1F5E;font-size:14px;margin:16px 0 8px}
table{width:100%;border-collapse:collapse;font-size:11px}
thead th{background:#0F1F5E;color:#fff;padding:6px 4px;text-align:center;border:1px solid #0F1F5E}
thead th:first-child{text-align:left}
tbody td{padding:4px;text-align:center;border:1px solid #CCC}
tbody td:first-child{text-align:left}
tbody tr:nth-child(even){background:#F0F0F0}
.t{background:#E8E8E8!important;font-weight:bold}
.f{margin-top:20px;text-align:center;font-size:10px;color:#999;border-top:1px solid #CCC;padding-top:6px}
.np{text-align:center;margin:8px}
.bp{background:#2ecc71;color:#fff;border:none;padding:8px 20px;font-size:14px;border-radius:4px;cursor:pointer}
td:nth-child(3){white-space:nowrap;}
@media print{.h,.c,#s,.np{display:none!important}#r{padding:0}.rc{border:none}@page{size:landscape;margin:.5in}}
</style>
</head>

<body>
<div class="h"><h1>TCCA Soil Report Generator</h1></div>

<div class="c">
<b style="color:#0F1F5E">Farm Number:</b>
<input id="fn" value="1071">
<button class="b" id="go">Generate Report</button>
</div>

<div id="s"></div>
<div id="r"></div>

<script>
var PORTAL="https://tillamookfarm.maps.arcgis.com";
var SERVER="https://services3.arcgis.com/6rtKUOn0HwWMTo5b/arcgis";
var QUERY_URL=SERVER+"/rest/services/Dashboard_Internal_WFL1/FeatureServer/8/query";
var APP_ID="PZTMDvs9PDdeYrAu";
var serverToken="";
var authReady=false;

function showStatus(m){var e=document.getElementById("s");e.style.display="block";e.textContent=m;}
function hideStatus(){document.getElementById("s").style.display="none";}

function fm(v,d){if(v==null||v==="")return"";return parseFloat(v).toFixed(d!=null?d:1);}

/* ✅ NEW DATE FORMATTER */
function fdate(v){
  if(!v) return "";
  var d=new Date(v);
  return (d.getMonth()+1)+"/"+d.getDate()+"/"+d.getFullYear();
}

function toMerc(lon,lat){
var x=lon*20037508.34/180;
var y=Math.log(Math.tan((90+lat)*Math.PI/360))*20037508.34/Math.PI;
return[x,y];
}

/* ✅ YOUR ORIGINAL buildMap (UNCHANGED EXCEPT COLOR FIXES) */
function buildMap(fs,fn,pr){
return new Promise(function(resolve){
var xs=[],ys=[];
for(var i=0;i<fs.length;i++){
var g=fs[i].geometry;
if(g&&g.rings){
for(var j=0;j<g.rings.length;j++){
for(var k=0;k<g.rings[j].length;k++){
xs.push(g.rings[j][k][0]);
ys.push(g.rings[j][k][1]);
}}}}
if(xs.length===0){resolve("");return;}

var mxs=[],mys=[];
for(var i=0;i<xs.length;i++){
var m=toMerc(xs[i],ys[i]);
mxs.push(m[0]);
mys.push(m[1]);
}

var xmin=Math.min(...mxs), xmax=Math.max(...mxs);
var ymin=Math.min(...mys), ymax=Math.max(...mys);

var dx=xmax-xmin||1, dy=ymax-ymin||1;
xmin-=dx*0.08; xmax+=dx*0.08; ymin-=dy*0.08; ymax+=dy*0.08;

dx=xmax-xmin; dy=ymax-ymin;

var W,H;
if(dx>dy){W=1000;H=Math.round(1000*dy/dx);}
else{H=1000;W=Math.round(1000*dx/dy);}
if(W<400)W=400;if(H<400)H=400;

var cv=document.createElement("canvas");
cv.width=W;
cv.height=H;
var cx=cv.getContext("2d");

var bmUrl="https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/export?bbox="+xmin+","+ymin+","+xmax+","+ymax+"&bboxSR=102100&size="+W+","+H+"&imageSR=102100&format=png&f=image";

function drawOverlay(){
for(var i=0;i<fs.length;i++){
var g=fs[i].geometry;
if(!g||!g.rings)continue;

for(var j=0;j<g.rings.length;j++){
cx.beginPath();
for(var k=0;k<g.rings[j].length;k++){
var mc=toMerc(g.rings[j][k][0],g.rings[j][k][1]);
var px=(mc[0]-xmin)/(xmax-xmin)*W;
var py=H-(mc[1]-ymin)/(ymax-ymin)*H;
if(k===0)cx.moveTo(px,py); else cx.lineTo(px,py);
}
cx.closePath();
cx.fillStyle="rgba(46,204,113,0.5)";
cx.fill();
cx.strokeStyle="#FFFF00";
cx.lineWidth=3;
cx.stroke();
}}

cx.font="bold 10px Helvetica";
cx.textAlign="center";

for(var i=0;i<fs.length;i++){
var g=fs[i].geometry;
if(!g||!g.rings)continue;

var ax=[],ay=[];
for(var j=0;j<g.rings.length;j++){
for(var k=0;k<g.rings[j].length;k++){
ax.push(g.rings[j][k][0]);
ay.push(g.rings[j][k][1]);
}}

var mlon=ax.reduce((a,b)=>a+b,0)/ax.length;
var mlat=ay.reduce((a,b)=>a+b,0)/ay.length;

var mc=toMerc(mlon,mlat);
var px=(mc[0]-xmin)/(xmax-xmin)*W;
var py=H-(mc[1]-ymin)/(ymax-ymin)*H;

var lb=(fs[i].attributes.PastureNumber||"").replace(fn+"-","");
var mt=cx.measureText(lb);

cx.fillStyle="rgba(255,255,255,0.85)";
cx.fillRect(px-mt.width/2-2,py-6,mt.width+4,12);
cx.fillStyle="#0F1F5E";   /* ✅ updated color */
cx.fillText(lb,px,py);
}

cx.font="bold 16px Helvetica";
var ti="Farm "+fn+": "+pr;
var tm=cx.measureText(ti);

cx.fillStyle="rgba(255,255,255,0.85)";
cx.fillRect(W/2-tm.width/2-10,8,tm.width+20,26);
cx.fillStyle="#0F1F5E";   /* ✅ updated color */
cx.fillText(ti,W/2,22);

var imgTag="<h3>Farm Map</h3>";
imgTag+="<img src='"+cv.toDataURL("image/png")+"' style='width:100%;max-width:950px;border:2px solid #0F1F5E;border-radius:4px;display:block;margin:0 auto'>";
resolve(imgTag);
}

var img=new Image();
img.crossOrigin="anonymous";
img.onload=function(){cx.drawImage(img,0,0,W,H);drawOverlay();};
img.onerror=function(){cx.fillStyle="#ddd";cx.fillRect(0,0,W,H);drawOverlay();};
img.src=bmUrl;

});
}

/* ✅ QUERY UPDATED TO INCLUDE SoilLastTest2 */
document.getElementById("go").onclick=function(){

var fn=document.getElementById("fn").value.trim();
if(!fn){showStatus("Enter Farm Number");return;}

fetch(QUERY_URL+"?where=PrimProdNum='"+fn+"'&outFields=PrimProdNum,PastureNumber,Producer,CAFO_Size,Acreage,SoilLastTest2,Nitrate,Ammonia,Phosphate,Potassium,OrgCarbon,PHLevel&returnGeometry=true&outSR=4326&f=json&token="+serverToken)

.then(r=>r.json())
.then(function(d){

var fs=d.features;
var pr=fs[0].attributes.Producer;
var ca=fs[0].attributes.CAFO_Size;

var ta=0, ro="";

for(var i=0;i<fs.length;i++){
var a=fs[i].attributes;
var ac=parseFloat(a.Acreage||0);

ta+=ac;

ro+=`<tr>
<td>${a.PastureNumber}</td>
<td>${fm(ac,2)}</td>
<td>${fdate(a.SoilLastTest2)}</td>
<td>${fm(a.Nitrate)}</td>
<td>${fm(a.Ammonia)}</td>
<td>${fm(a.Phosphate)}</td>
<td>${fm(a.Potassium,0)}</td>
<td>${fm(a.OrgCarbon)}</td>
<td>${fm(a.PHLevel)}</td>
</tr>`;
}

ro+=`<tr class="t">
<td>TOTAL</td>
<td>${ta.toFixed(2)}</td>
<td></td><td></td><td></td><td></td><td></td><td></td><td></td>
</tr>`;

buildMap(fs,fn,pr).then(function(mapHtml){

document.getElementById("r").innerHTML=`
<div class="rc">
<div class="rh"><h2>TCCA Soil Sampling Report</h2></div>

<div class="rb">

<div class="ig">
<div><b>Farm:</b> ${fn}</div>
<div><b>Producer:</b> ${pr}</div>
<div><b>CAFO:</b> ${ca}</div>
<div><b>Pastures:</b> ${fs.length}</div>
<div><b>Acres:</b> ${ta.toFixed(2)}</div>
<div><b>Date:</b> ${new Date().toLocaleDateString()}</div>
</div>

${mapHtml}

<h3>Soil Sample Results</h3>

<table>
<thead>
<tr>
<th>Pasture</th>
<th>Acres</th>
<th>Last Sample Date</th>
<th>Nitrate</th>
<th>Ammonia</th>
<th>Phosphate</th>
<th>Potassium</th>
<th>Org Matter</th>
<th>pH</th>
</tr>
</thead>

<tbody>${ro}</tbody>
</table>

<div class="f">
Tillamook County Creamery Association, Field Services
</div>

</div>
</div>
`;

document.getElementById("r").style.display="block";

});

});
};
</script>

</body>
</html>
``
